<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lore editor</title>
<link rel="icon" href="data:,">
<style>
:root{
 color-scheme:dark;
 --bg:#14171c; --panel:#1b1f26; --panel2:#222832; --line:#303845; --text:#d9dee6; --dim:#8f9aa8;
 --accent:#7aa2f7; --green:#7fbf7f; --red:#e0736f; --amber:#d9a55b; --purple:#b392e0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#2b3a5c;border-color:#40558a}
button.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
button.small{padding:2px 7px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;background:#12151a;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea{resize:vertical;line-height:1.4}
textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.bad{border-color:var(--red)!important}
header{position:sticky;top:0;z-index:20;background:#171a20;border-bottom:1px solid var(--line);padding:8px 14px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.dirty{color:var(--amber);border-color:var(--amber)}
.chip.ok{color:var(--green)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tabs button{border-radius:6px 6px 0 0;border-bottom-color:transparent;background:transparent;color:var(--dim)}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--text);border-color:var(--line);border-bottom-color:var(--panel)}
.tabs .cnt{color:var(--red);margin-left:4px}
#say{font-size:13px;color:var(--dim);margin-top:6px;min-height:1.2em}
#say.err{color:var(--red)} #say.ok{color:var(--green)}
main{padding:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.scroll{overflow:auto;max-width:100%}
.md{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.list{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
.list h3{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.list h3:first-child{margin-top:0}
.list ul{list-style:none;margin:0;padding:0}
.list li button{display:block;width:100%;text-align:left;border-color:transparent;background:transparent;padding:5px 8px}
.list li button[aria-current=true]{background:var(--panel2);border-color:var(--line)}
.list .sub{display:block;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.error{background:var(--red)} .dot.warn{background:var(--amber)} .dot.note{background:var(--dim)}
@media (max-width:820px){.md{grid-template-columns:minmax(0,1fr)}.list{position:static;max-height:32vh}header{position:static}}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:10px 12px;min-width:0}
legend{padding:0 6px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px;margin-bottom:8px}
.fld{display:block;min-width:0;margin-bottom:8px}
.grid .fld{margin-bottom:0}
.lab{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.hint{font-size:12px;color:var(--dim);margin-top:2px}
.hint.err{color:var(--red)}
.chk{display:inline-flex;align-items:center;gap:6px;margin:2px 12px 2px 0}
.rows{margin-bottom:8px}
.row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.row.card{background:#181c22;border:1px solid var(--line);border-radius:8px;padding:8px}
.rowbody{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.rowbody>*{flex:1 1 120px;min-width:0}
.row.card .rowbody{display:block}
.rowbtns{display:flex;gap:3px;flex:none}
.row.card .rowbtns{flex-direction:column}
.sublab{font-size:12px;color:var(--dim);margin:6px 0 3px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.bar h2{font-size:16px;margin:0 auto 0 0;overflow:hidden;text-overflow:ellipsis}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 8px}
.traits .good{color:var(--green)} .traits .badt{color:var(--red)}
svg.graph{display:block}
.edge{fill:none;stroke-width:1.6}
.k-done{stroke:var(--green)} .k-ignored{stroke:var(--red)} .k-other{stroke:#8a94a3}
.edge.unless{stroke-dasharray:6 4;stroke:var(--red)}
.edge.hint{stroke-dasharray:2 4}
.elabel{font-size:11px;fill:var(--dim);paint-order:stroke;stroke:var(--panel);stroke-width:4px;text-anchor:middle}
.node{cursor:grab}
.node .shape{fill:#232a35;stroke:#4a5568;stroke-width:1.4}
.node.unique .shape{fill:#2a2438;stroke:var(--purple)}
.node.bad .shape{stroke:var(--red)}
.node.dim{opacity:.55}
.node .missing{stroke-dasharray:4 3}
.node text{fill:var(--text);font-size:13px;pointer-events:none}
.node text.s{fill:var(--dim);font-size:11px}
.node:focus-visible .shape{stroke:var(--accent);stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--dim);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:26px;border-top:2px solid;margin-right:5px;vertical-align:middle}
.tl{position:relative}
.tl .axis{position:sticky;top:0;height:26px;border-bottom:1px solid var(--line);background:var(--panel);z-index:2}
.tl .tick{position:absolute;top:4px;font-size:12px;color:var(--dim);padding-left:4px}
.tl .lane{position:relative;border-bottom:1px solid var(--line)}
.tl .lanet{position:sticky;left:0;display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);padding:4px 6px;background:var(--panel);z-index:1}
.tl .pre{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.035);pointer-events:none}
.tl .ev{position:absolute;width:196px;height:40px;text-align:left;padding:3px 8px;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;overflow:hidden;line-height:1.25}
.tl .ev b,.unsched button b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ev span,.unsched button span{font-size:11px;color:var(--dim)}
.tl .trow{position:relative;height:76px}
.tl .rbar{position:absolute;top:6px;height:24px;padding:0 0 0 8px;text-align:left;white-space:nowrap;background:#2b3a5c;border-color:#40558a;overflow:visible;border-radius:5px}
.tl .rbar.open{background:linear-gradient(to right,#2b3a5c,rgba(43,58,92,0));border-right-color:transparent}
.tl .tsteps,.tl .tdeadl{position:absolute;font-size:12px;white-space:nowrap}
.tl .tsteps{top:33px;color:var(--dim)}
.tl .tsteps .g{color:var(--green)}
.tl .tdead{position:absolute;top:2px;bottom:2px;border-left:2px solid var(--red)}
.tl .tdeadl{top:53px;color:var(--red);padding-left:6px}
.unsched{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 8px}
.unsched button{text-align:left;max-width:320px;border-left:3px solid var(--dim)}
.plist{list-style:none;margin:0;padding:0}
.plist li button{display:block;width:100%;text-align:left;margin-bottom:4px;background:transparent}
.sev{font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:8px}
.sev.error{color:var(--red)} .sev.warn{color:var(--amber)} .sev.note{color:var(--dim)}
.welcome{max-width:720px;margin:30px auto;line-height:1.6}
.welcome code{background:#12151a;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
 <div class="top">
  <h1>Lore editor</h1>
  <button id="bDir" class="primary">Open data folder</button>
  <button id="bFiles">Open files…</button>
  <input id="fIn" type="file" multiple accept=".json,application/json" hidden>
  <button id="bSave" disabled title="Ctrl+S">Save</button>
  <button id="bReload" disabled>Reload</button>
  <div class="chips" id="chips" aria-label="Files"></div>
 </div>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div id="say" role="status" aria-live="polite"></div>
</header>
<main id="main"></main>
<div id="lists"></div>
<script>
'use strict';
/* ====================================================================================================
   Core: no DOM in this part (a Node script can run it). Parsing, writing, what leads to what, days,
   problems.
   ==================================================================================================== */
const FILES = ['rumors', 'uniques', 'lore', 'traits'];
const EDITABLE = ['rumors', 'uniques', 'lore'];
const ARR = {rumors: ['rumors'], uniques: ['uniques'], lore: ['places', 'events', 'characters'], traits: ['traits']};
const STYLE = {rumors: 'rumor', uniques: 'block', lore: 'line', traits: 'line'};
const ORD = {
 rumor: ['id', 'title', 'teller', 'appears', 'told', 'expires', 'steps', 'reward', 'failed', 'leads'],
 appears: ['afterDay', 'after', 'unless'], step: ['id', 'note', 'place', 'done'],
 place: ['kind', 'rumor', 'step', 'section', 'corner', 'misted', 'x', 'y', 'vague'],
 done: ['kind', 'within', 'radius', 'share', 'days', 'event'],
 reward: ['effects', 'gifts', 'log'], failed: ['effects', 'log'], leads: ['done', 'ignored'],
 unique: ['id', 'name', 'look', 'about', 'traits', 'level'],
 lplace: ['id', 'name', 'section', 'about'], levent: ['id', 'day', 'title', 'place', 'about', 'rumors'],
 lchar: ['id', 'name', 'unique', 'about']
};
const PLACE_FIELDS = {forest: ['section', 'corner', 'misted'], same: [], of: ['rumor', 'step'], village: [], section: ['section'], cell: ['x', 'y']};
const DONE_FIELDS = {reach: ['within'], cleared: ['radius', 'share'], days: ['days'], event: ['event']};
const CORNERS = ['upper-left', 'upper-right', 'lower-left', 'lower-right'];

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const arr = v => Array.isArray(v) ? v : [];
const str = v => typeof v === 'string' && v !== '';
const numOr = (v, d) => typeof v === 'number' && isFinite(v) ? v : d;
const minOf = list => { let m = null; for (const v of list) if (v != null && (m == null || v < m)) m = v; return m; };

/* Sets obj[key], putting a new key where the file's usual order has it (not at the end). */
function put(obj, key, val, order) {
 if (key in obj || !order || order.indexOf(key) < 0) { obj[key] = val; return; }
 const at = order.indexOf(key), ents = Object.entries(obj);
 let pos = ents.length;
 for (let i = 0; i < ents.length; i++) { const o = order.indexOf(ents[i][0]); if (o > at) { pos = i; break; } }
 ents.splice(pos, 0, [key, val]);
 for (const k of Object.keys(obj)) delete obj[k];
 for (const [k, v] of ents) obj[k] = v;
}
function sub(obj, key, order) { if (!isObj(obj[key])) { if (key in obj) obj[key] = {}; else put(obj, key, {}, order); } return obj[key]; }
function setKind(o, kind, fields, order) {
 put(o, 'kind', kind, order);
 const keep = fields[kind] || [];
 for (const k of Object.keys(fields)) for (const f of fields[k]) if (keep.indexOf(f) < 0) delete o[f];
}

/* The text of each element of the top-level arrays, as written in the file: an item nobody changed is written
   back exactly as it was. */
function scanItems(text) {
 const out = {items: {}, pre: {}, keyPre: null}, n = text.length; let i = 0;
 const lead = at => { const nl = text.lastIndexOf('\n', at - 1), p = text.slice(nl + 1, at); return nl >= 0 && /^[ \t]*$/.test(p) ? p : null; };
 const ws = () => { while (i < n && /\s/.test(text[i])) i++; };
 const sstr = () => { const s = i; i++; while (i < n && text[i] !== '"') { if (text[i] === '\\') i++; i++; } i++; return text.slice(s, i); };
 const val = () => {
  ws(); const s = i, c = text[i];
  if (c === '"') sstr();
  else if (c === '{' || c === '[') {
   let d = 0;
   do { const ch = text[i]; if (ch === '"') { sstr(); continue; } if (ch === '{' || ch === '[') d++; else if (ch === '}' || ch === ']') d--; i++; } while (d > 0 && i < n);
  } else while (i < n && !/[,\]}\s]/.test(text[i])) i++;
  return text.slice(s, i);
 };
 try {
  ws(); if (text[i] !== '{') return out; i++;
  for (;;) {
   ws(); if (i >= n || text[i] === '}') break;
   if (text[i] === ',') { i++; continue; }
   if (out.keyPre === null) out.keyPre = lead(i) || '';
   const key = JSON.parse(sstr()); ws(); i++; ws();
   if (text[i] === '[') {
    i++; const items = [];
    for (;;) { ws(); if (i >= n) break; if (text[i] === ']') { i++; break; } if (text[i] === ',') { i++; continue; } if (!items.length) out.pre[key] = lead(i); items.push(val()); }
    out.items[key] = items;
   } else val();
  }
 } catch (e) { return {items: {}, pre: {}, keyPre: null}; }
 return out;
}

function parseFile(name, raw) {
 let text = raw;
 const bom = text.charCodeAt(0) === 0xFEFF; if (bom) text = text.slice(1);
 const eol = text.indexOf('\r\n') >= 0 ? '\r\n' : '\n';
 text = text.replace(/\r\n/g, '\n');
 const doc = JSON.parse(text);
 if (!isObj(doc)) throw new Error('the top level is not an object');
 let std = null;                               // written by a program (plain nested indentation)? then it is written back the same way
 const body = text.replace(/\s+$/, '');
 for (const c of [' ', '  ', '    ', '\t']) if (JSON.stringify(doc, null, c) === body) { std = c; break; }
 for (const k of ARR[name]) {
  if (doc[k] === undefined) doc[k] = [];
  if (!Array.isArray(doc[k]) || !doc[k].every(isObj)) throw new Error('"' + k + '" should be a list of objects');
 }
 const st = {name, doc, raw, bom, eol, nl: text.endsWith('\n'), orig: new Map(), isNew: false, std};
 const scan = scanItems(text), spans = scan.items;
 st.pre = scan.pre; st.keyPre = scan.keyPre || '';
 for (const k of Object.keys(spans)) for (const t of spans[k]) { try { st.orig.set(JSON.stringify(JSON.parse(t)), t); } catch (e) {} }
 st.base = JSON.stringify(doc);
 return st;
}
function blankFile(name) {
 const doc = {}; for (const k of ARR[name]) doc[k] = [];
 return {name, doc, raw: null, bom: false, eol: '\n', nl: true, orig: new Map(), isNew: true, std: null, pre: {}, keyPre: '', base: JSON.stringify(doc)};
}
const isDirty = st => !!st && JSON.stringify(st.doc) !== st.base;

/* Writing. inl: on one line, as the files are written by hand ({"a": 1, "b": [1, 2]}). */
function inl(v) {
 if (v === null || typeof v !== 'object') { const s = JSON.stringify(v); return s === undefined ? 'null' : s; }
 if (Array.isArray(v)) return '[' + v.map(inl).join(', ') + ']';
 return '{' + Object.keys(v).map(k => JSON.stringify(k) + ': ' + inl(v[k])).join(', ') + '}';
}
function fit(v, ind, width) {
 const s = inl(v);
 if (v === null || typeof v !== 'object' || s.length + ind <= width) return s;
 const pad = ' '.repeat(ind + 1), end = ' '.repeat(ind);
 if (Array.isArray(v)) return v.length ? '[\n' + v.map(x => pad + fit(x, ind + 1, width)).join(',\n') + '\n' + end + ']' : '[]';
 const ks = Object.keys(v);
 return ks.length ? '{\n' + ks.map(k => pad + JSON.stringify(k) + ': ' + fit(v[k], ind + 1, width)).join(',\n') + '\n' + end + '}' : '{}';
}
function fmtStep(s) {
 if (!isObj(s)) return '  ' + inl(s);
 const first = [], rest = [];
 for (const k of Object.keys(s)) ((k === 'id' || k === 'note') && !rest.length ? first : rest).push(k);
 const kv = k => JSON.stringify(k) + ': ' + inl(s[k]);
 const lines = []; if (first.length) lines.push(first.map(kv).join(', ')); for (const k of rest) lines.push(kv(k));
 return '  {' + lines.join(',\n   ') + '}';
}
function fmtItem(it, style) {
 if (style === 'line') return inl(it);
 const lines = Object.keys(it).map(k => {
  const v = it[k], head = ' ' + JSON.stringify(k) + ': ';
  if (style === 'rumor') {
   if (k === 'steps' && Array.isArray(v) && v.length) return head + '[\n' + v.map(fmtStep).join(',\n') + '\n ]';
   if (ORD.rumor.indexOf(k) >= 0) return head + inl(v);
  }
  return head + fit(v, 1, 120);
 });
 return lines.length ? '{\n' + lines.join(',\n') + '\n}' : '{}';
}
function serialize(st) {
 const doc = st.doc, style = STYLE[st.name] || 'block', parts = [], kp = st.keyPre || '';
 for (const k of Object.keys(doc)) {
  const v = doc[k]; let s;
  if (Array.isArray(v) && v.length && v.every(isObj)) {
   const pre = typeof st.pre[k] === 'string' ? st.pre[k] : kp + (style === 'line' ? ' ' : '');
   s = '[\n' + v.map(it => { const o = st.orig.get(JSON.stringify(it)); return pre + (o !== undefined ? o : fmtItem(it, style).replace(/\n/g, '\n' + pre)); }).join(',\n') + '\n' + kp + ']';
  } else s = fit(v, kp.length, 120);
  parts.push(kp + JSON.stringify(k) + ': ' + s);
 }
 let out = st.std ? JSON.stringify(doc, null, st.std) + (st.nl ? '\n' : '') : '{\n' + parts.join(',\n') + '\n}' + (st.nl ? '\n' : '');
 let ok = false;
 try { ok = JSON.stringify(JSON.parse(out)) === JSON.stringify(doc); } catch (e) {}
 if (!ok) {                                   // never write what isn't the data: fall back to the plain writer
  out = JSON.stringify(doc, null, 1) + '\n';
  if (JSON.stringify(JSON.parse(out)) !== JSON.stringify(doc)) throw new Error('could not write ' + st.name + '.json as valid JSON');
 }
 if (st.eol === '\r\n') out = out.replace(/\n/g, '\r\n');
 return (st.bom ? '﻿' : '') + out;
}

function dataOf(files) {
 const g = (f, k) => { const d = files[f] && files[f].doc; return d && Array.isArray(d[k]) ? d[k] : []; };
 return {rumors: g('rumors', 'rumors'), uniques: g('uniques', 'uniques'), places: g('lore', 'places'), events: g('lore', 'events'),
  characters: g('lore', 'characters'), traits: g('traits', 'traits'), hasTraits: !!files.traits};
}
const expDays = r => isObj(r.expires) && typeof r.expires.days === 'number' ? r.expires.days : null;
const afterEvents = r => arr(isObj(r.appears) ? r.appears.after : null).map(x => isObj(x) ? x.event : undefined).filter(str);
const unlessEvents = r => arr(isObj(r.appears) ? r.appears.unless : null).filter(str);
function effectOf(e) {
 if (typeof e !== 'string') return {k: ''};
 const c = e.indexOf(':'); return c < 0 ? {k: e, v: ''} : {k: e.slice(0, c), v: e.slice(c + 1)};
}

/* Everything the views show, worked out from the data: who records which event, what leads to what (edges), the
   earliest day each rumor can be told / done / is over, which can never be told, and the problems. */
function analyze(D) {
 const rumors = D.rumors;
 const rIdx = new Map(), uIdx = new Map();
 rumors.forEach((r, i) => { if (!rIdx.has(r.id)) rIdx.set(r.id, i); });
 D.uniques.forEach((u, i) => { if (!uIdx.has(u.id)) uIdx.set(u.id, i); });

 // prod: event -> who records it. usrc: unique id -> the rumor outcomes that bring them in / lose them.
 const prod = new Map(), usrc = new Map();
 const addP = (ev, p) => { if (!prod.has(ev)) prod.set(ev, []); prod.get(ev).push(p); };
 rumors.forEach((r, i) => {
  const id = r.id;
  addP('known:' + id, {r: i, via: 'known'}); addP('heard:' + id, {r: i, via: 'heard'}); addP('done:' + id, {r: i, via: 'done'});
  if (expDays(r) != null) addP('ignored:' + id, {r: i, via: 'ignored'});
  arr(r.steps).forEach((s, j) => { if (isObj(s)) addP('step:' + id + '/' + s.id, {r: i, via: 'step', step: j}); });
  for (const [outcome, key] of [['done', 'reward'], ['ignored', 'failed']]) {
   for (const e of arr(isObj(r[key]) ? r[key].effects : null)) {
    const f = effectOf(e);
    if (f.k === 'record' && f.v) addP(f.v, {r: i, via: outcome, record: true});
    else if ((f.k === 'unique_arrives' || f.k === 'unique_lost') && f.v) {
     if (!usrc.has(f.v)) usrc.set(f.v, []);
     usrc.get(f.v).push({r: i, outcome, what: f.k === 'unique_arrives' ? 'arrives' : 'lost'});
    }
   }
  }
 });
 usrc.forEach((list, u) => {
  if (list.some(s => s.what === 'arrives')) addP('unique:' + u, {u, what: 'arrives'});
  if (list.some(s => s.what === 'lost')) addP('lost:' + u, {u, what: 'lost'});
 });

 // An event with none of the rumors' own prefixes that no "record:" writes: taken as written by the game itself.
 const external = ev => !prod.has(ev) && !/^(known|heard|done|ignored|step|unique|lost):/.test(ev);
 const externals = new Set();

 // Days: the earliest each thing can happen (a rumor heard the day it can be told, each step done at once).
 const memo = {}, busy = new Set();
 const appear = i => {
  const k = 'a' + i; if (k in memo) return memo[k];

/* ---- form pieces: each takes {get, set}; set writes the data, then touch() ---- */
function tx(o) {
 const v = o.get(), val = v == null ? '' : String(v);
 const el = o.area ? h('textarea', {rows: o.rows || Math.max(2, Math.min(10, Math.ceil(val.length / 90) + 1))}) : h('input', {type: 'text'});
 if (o.list) el.setAttribute('list', o.list);
 if (o.ph) el.placeholder = o.ph;
 if (o.label) el.setAttribute('aria-label', o.label);
 if (o.mono) el.classList.add('mono');
 el.value = val;
 el.addEventListener(o.commit ? 'change' : 'input', () => { o.set(el.value); touch(); if (o.commit) later(render); });
 return el;
}
function nm(o) {            // an empty box gives set(null)
 const v = o.get();
 const el = h('input', {type: 'number', step: o.step || 'any'});
 if (o.ph) el.placeholder = o.ph;
 if (o.label) el.setAttribute('aria-label', o.label);
 el.value = typeof v === 'number' ? String(v) : '';
 el.addEventListener('input', () => {
  if (el.value.trim() === '') { if (el.validity && el.validity.badInput) { el.classList.add('bad'); return; } el.classList.remove('bad'); o.set(null); touch(); return; }
  const n = Number(el.value);
  if (!isFinite(n)) { el.classList.add('bad'); return; }
  el.classList.remove('bad'); o.set(n); touch();
 });
 return el;
}
function ck(o, label) {
 const el = h('input', {type: 'checkbox', checked: !!o.get()});
 el.addEventListener('change', () => { o.set(el.checked); touch(); });
 return h('label', {class: 'chk'}, el, label);
}
function sl(o, options) {    // options: [[value, label]]; a change redraws the form (other fields depend on it)
 const cur = o.get() == null ? '' : String(o.get());
 const opts = options.slice();
 if (!opts.some(x => x[0] === cur)) opts.push([cur, cur + ' (unknown)']);
 const el = h('select', {value: cur}, opts.map(x => h('option', {value: x[0]}, x[1])));
 if (o.label) el.setAttribute('aria-label', o.label);
 el.value = cur;
 el.addEventListener('change', () => { o.set(el.value); touch(); later(render); });
 return el;
}
const fld = (label, el, hint) => h('label', {class: 'fld'}, h('span', {class: 'lab'}, label), el, hint ? h('span', {class: 'hint'}, hint) : null);
const sec = (title, ...kids) => h('fieldset', null, h('legend', null, title), kids);

/* A list that can be added to, removed from and reordered. o: fk (a name for keeping the focus), get() (the array, or
   nothing), ensure() (the array, made if it wasn't there), make() (a new item), row(item, i, array), add (the button),
   after() (once something's removed), card. */
function rows(o) {
 const box = h('div', {class: 'rows'}), a = arr(o.get());
 a.forEach((it, i) => {
  const mv = d => () => { const l = o.get(); const x = l.splice(i, 1)[0]; l.splice(i + d, 0, x); A.focusKey = o.fk + ':' + (i + d) + (d < 0 ? ':up' : ':dn'); changed(true); };
  const rm = () => { o.get().splice(i, 1); if (o.after) o.after(); A.focusKey = o.fk + ':add'; changed(true); };
  box.append(h('div', {class: 'row' + (o.card ? ' card' : ''), 'data-fk': o.fk + ':' + i},
   h('div', {class: 'rowbody'}, o.row(it, i, a)),
   h('div', {class: 'rowbtns'},
    btn('↑', mv(-1), {class: 'small', disabled: i === 0, 'aria-label': 'Move up', title: 'Move up', 'data-fk': o.fk + ':' + i + ':up'}),
    btn('↓', mv(1), {class: 'small', disabled: i === a.length - 1, 'aria-label': 'Move down', title: 'Move down', 'data-fk': o.fk + ':' + i + ':dn'}),
    btn('✕', rm, {class: 'small danger', 'aria-label': 'Remove', title: 'Remove'}))));
 });
 box.append(btn('+ ' + o.add, () => { const l = o.ensure(); l.push(o.make()); A.focusKey = o.fk + ':' + (l.length - 1); changed(true); }, {class: 'small', 'data-fk': o.fk + ':add'}));
 return box;
}
const strRows = (o) => rows(Object.assign({make: () => '', row: (it, i, a) => tx({get: () => a[i], set: v => { a[i] = v; }, list: o.list, ph: o.ph, label: o.add})}, o));

/* Fields the editor has no form for: shown as JSON, and kept as they are unless edited here. */
function extras(obj, known) {
 const unk = () => { const o = {}; for (const k of Object.keys(obj)) if (known.indexOf(k) < 0) o[k] = obj[k]; return o; };
 const text = JSON.stringify(unk(), null, 1);
 const ta = h('textarea', {class: 'mono', spellcheck: 'false', rows: Math.max(2, Math.min(16, text.split('\n').length + 1))});
 ta.value = text;
 const msg = h('div', {class: 'hint'}, 'Fields this editor has no form for. Kept exactly as they are unless you edit them here (JSON object).');
 const fail = m => { msg.textContent = m + ' Not applied yet.'; msg.className = 'hint err'; ta.classList.add('bad'); };
 ta.addEventListener('input', () => {
  let v;
  try { v = JSON.parse(ta.value.trim() === '' ? '{}' : ta.value); } catch (e) { return fail('Not valid JSON: ' + e.message + '.'); }
  if (!isObj(v)) return fail('This has to be a JSON object: { ... }.');
  const clash = Object.keys(v).filter(k => known.indexOf(k) >= 0);
  if (clash.length) return fail('"' + clash[0] + '" has its own box above.');
  for (const k of Object.keys(obj)) if (known.indexOf(k) < 0 && !(k in v)) delete obj[k];
  for (const k of Object.keys(v)) obj[k] = v[k];
  msg.textContent = 'Applied.'; msg.className = 'hint'; ta.classList.remove('bad'); touch();
 });
 return sec('Other fields (raw JSON)', h('label', {class: 'fld'}, h('span', {class: 'lab'}, 'Other fields'), ta), msg);
}

function uniqId(base, list) { const ids = new Set(list.map(x => x.id)); if (!ids.has(base)) return base; for (let n = 2; ; n++) if (!ids.has(base + '_' + n)) return base + '_' + n; }
/* The heading of a form: its name, and move / duplicate / delete in the file's list. */
function itemBar(title, list, i, select, what) {
 return h('div', {class: 'bar'}, h('h2', null, title),
  btn('↑', () => { const x = list.splice(i, 1)[0]; list.splice(i - 1, 0, x); select(i - 1); changed(true); }, {disabled: i === 0, title: 'Move up in the file', 'aria-label': 'Move up in the file'}),
  btn('↓', () => { const x = list.splice(i, 1)[0]; list.splice(i + 1, 0, x); select(i + 1); changed(true); }, {disabled: i >= list.length - 1, title: 'Move down in the file', 'aria-label': 'Move down in the file'}),
  btn('Duplicate', () => { const c = JSON.parse(JSON.stringify(list[i])); c.id = uniqId(String(c.id) + '_copy', list); list.splice(i + 1, 0, c); select(i + 1); changed(true); }),
  btn('Delete', () => { if (!confirm('Delete ' + what + ' "' + list[i].id + '"? Things that refer to it will show under Problems.')) return; list.splice(i, 1); select(Math.max(0, i - 1)); changed(true); }, {class: 'danger'}));

/* An id box: applied when left (not at each key), and whatever refers to the old id follows. */
function idBox(obj, list, rename) {

  const old = obj.id; v = v.trim();
  if (v === old) return;
  const carry = str(old) && str(v) && list.filter(x => x.id === old).length === 1 && !list.some(x => x.id === v);
  obj.id = v;
  if (carry && rename) rename(old, v);

 if (dep.length) out.append(h('h3', {class: 'sublab'}, 'Depends (no day can be worked out)'), h('div', {class: 'unsched'}, dep.map(i => {
  const r = D.rumors[i], bad = arr(isObj(r.appears) ? r.appears.after : null).filter(x => !isObj(x) || an.evDay(x.event) == null).map(x => isObj(x) ? x.event : '?');
  return h('button', {type: 'button', onclick: () => goto('rumor', i)}, h('b', null, r.title || r.id), h('span', null, 'depends on ' + (bad.join(', ') || 'itself') + (bad.some(e => an.externals.has(e)) ? ' (written by the game: no day known)' : '')));
 })));
 out.append(h('h3', {class: 'sublab'}, 'Unscheduled events (day not fixed yet)'), undated.length ? h('div', {class: 'unsched'}, undated.map(x =>
  h('button', {type: 'button', title: x.e.about || '', onclick: () => goto('event', x.i)}, h('b', null, x.e.title || x.e.id), h('span', null, x.e.place ? pname(x.e.place) : 'no place')))) : h('p', {class: 'hint'}, 'None.'));
 return out;
}

/* ---- Problems ---- */
function viewProblems() {
 const P = A.an.problems, word = {error: 'Error', warn: 'Check', note: 'Note'};
 return h('div', {class: 'panel'}, h('div', {class: 'bar'}, h('h2', null, P.length ? P.length + ' to look at' : 'No problems found')),
  h('p', {class: 'hint'}, 'Checked as you type. Click one to open its item.'),
  h('ul', {class: 'plist'}, P.map(p => h('li', null, h('button', {type: 'button', onclick: () => goto(p.t, p.i)}, h('span', {class: 'sev ' + p.sev}, word[p.sev]), p.msg)))));
}

function viewWelcome() {
 return h('div', {class: 'panel welcome'}, h('h2', null, 'Open the game\'s data folder'),
  h('p', null, 'Choose the project\'s ', h('code', null, 'data'), ' folder with "Open data folder". The editor reads ', h('code', null, 'rumors.json'), ', ', h('code', null, 'uniques.json'), ', ', h('code', null, 'lore.json'), ' and ', h('code', null, 'traits.json'), ', and saves the first three back in place (Ctrl+S).'),
  h('p', null, window.showDirectoryPicker ? 'Or use "Open files…" (or drop the files on this page): saving then downloads the changed files, for you to put back in the folder.'
   : 'This browser cannot open a folder for writing. Use "Open files…" (or drop the files on this page) and pick the four files: saving then downloads the changed files, for you to put back in the folder.'),
  h('p', {class: 'hint'}, 'Nothing leaves this computer: the page makes no network requests.'));
}

/* ---- drawing the page ---- */
function render() {
 const main = $('#main');
 const focusables = () => [...main.querySelectorAll('input,select,textarea,button,[tabindex]')];
 const at = main.contains(document.activeElement) ? focusables().indexOf(document.activeElement) : -1;
 const y = window.scrollY, sc = main.querySelector('.scroll'), sx = sc ? sc.scrollLeft : 0;
 A.refreshList = null;
 const v = !A.files.rumors ? viewWelcome() : A.view === 'graph' ? viewGraph() : A.view === 'timeline' ? viewTimeline() : A.view === 'rumors' ? viewRumors()
  : A.view === 'chars' ? viewChars() : A.view === 'world' ? viewWorld() : viewProblems();
 main.replaceChildren(v); chrome();
 window.scrollTo(0, y);
 const sc2 = main.querySelector('.scroll'); if (sc2) sc2.scrollLeft = sx;
 let f = null;
 if (A.focusKey) { f = main.querySelector('[data-fk="' + A.focusKey + '"]'); if (f && (f.disabled || !f.matches('input,select,textarea,button'))) f = (f.closest('.row') || f).querySelector('input,select,textarea'); A.focusKey = null; }
 else if (at >= 0) f = focusables()[at];
 if (f && !f.disabled) f.focus({preventScroll: true});
}

/* ---- opening and saving ---- */
function loadTexts(texts, handles, replace) {
 const next = replace ? {} : Object.assign({}, A.files), errs = [];
 for (const n of FILES) {
  if (!(n in texts)) continue;
  try { next[n] = parseFile(n, texts[n]); } catch (e) { errs.push(n + '.json: ' + e.message); }
 }
 if (errs.length) { say('Not loaded. ' + errs.join(' | '), 'err'); return false; }
 if (!next.rumors) { say('rumors.json is needed (uniques.json, lore.json and traits.json beside it).', 'err'); return false; }
 for (const n of ['uniques', 'lore']) if (!next[n]) next[n] = blankFile(n);
 A.files = next; A.handles = replace ? (handles || {}) : Object.assign(A.handles, handles || {});
 touch(); render();
 say('Loaded ' + FILES.filter(n => n in texts).map(n => n + '.json').join(', ') + '.' + (A.files.traits ? '' : ' traits.json was not found: traits are edited as plain ids.'), 'ok');
 return true;
}
const okToDrop = () => !anyDirty() || confirm('There are unsaved changes. Load anyway and lose them?');
async function readDir(dir) {
 const texts = {}, handles = {};
 for (const n of FILES) {
  try { const fh = await dir.getFileHandle(n + '.json'); handles[n] = fh; texts[n] = await (await fh.getFile()).text(); }
  catch (e) { if (e.name !== 'NotFoundError') throw e; }
 }
 if (!('rumors' in texts)) { say('There is no rumors.json in that folder: choose the project\'s "data" folder.', 'err'); return; }
 const before = A.dir; A.dir = dir;
 if (!loadTexts(texts, handles, true)) A.dir = before;
}
async function openDir() {
 if (!okToDrop()) return;
 try { await readDir(await window.showDirectoryPicker({id: 'lore-data', mode: 'readwrite'})); }
 catch (e) { if (e.name !== 'AbortError') say('Could not open the folder (' + e.message + '). Use "Open files…" instead.', 'err'); }
}
async function openFiles(fileList) {
 const texts = {};
 for (const f of fileList) { const n = f.name.replace(/\.json$/i, '').toLowerCase(); if (FILES.indexOf(n) >= 0) texts[n] = await f.text(); }
 if (!Object.keys(texts).length) return say('None of those is rumors.json, uniques.json, lore.json or traits.json.', 'err');
 if (!okToDrop()) return;
 A.dir = null; loadTexts(texts, {}, false);
}
function download(name, text) {
 const a = h('a', {href: URL.createObjectURL(new Blob([text], {type: 'application/json'})), download: name});
 document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function saveAll() {
 if (document.activeElement && main.contains(document.activeElement) && document.activeElement.matches('input[type=text]')) document.activeElement.dispatchEvent(new Event('change'));
 const done = [], skipped = [];
 try {
  for (const n of EDITABLE) {
   const st = A.files[n]; if (!isDirty(st)) continue;
   const out = serialize(st);                 // throws rather than give anything that isn't the data as JSON
   if (A.dir) {
    let fh = A.handles[n];
    if (fh && st.raw != null) {
     const cur = await (await fh.getFile()).text();
     if (cur !== st.raw && !confirm(n + '.json was changed on disk since it was loaded (by the game, an editor, or someone else). Overwrite it with this version?')) { skipped.push(n + '.json'); continue; }
    }
    if (!fh) fh = A.handles[n] = await A.dir.getFileHandle(n + '.json', {create: true});
    const w = await fh.createWritable(); await w.write(out); await w.close();
   } else download(n + '.json', out);
   const fresh = parseFile(n, out); fresh.doc = st.doc; fresh.base = JSON.stringify(st.doc);
   A.files[n] = fresh; done.push(n + '.json');
  }
  say((done.length ? (A.dir ? 'Saved ' : 'Downloaded ') + done.join(', ') + '.' + (A.dir ? '' : ' Put the downloaded files in the data folder.') : skipped.length ? '' : 'Nothing to save.') + (skipped.length ? ' Not saved: ' + skipped.join(', ') + '.' : ''), skipped.length ? 'err' : 'ok');
 } catch (e) {
  // (the launcher gone: the browser can only say "Failed to fetch")
  const gone = A.dir === serverDir && e instanceof TypeError;
  say((gone ? 'Not saved: the launcher isn’t running (its window was closed?). Start lore_editor.bat again, then press Save here again: your changes are still in this page.'
   : 'Saving failed: ' + e.message) + (done.length ? ' (saved before that: ' + done.join(', ') + ')' : ''), 'err');
 }
 chrome();
}
const main = $('#main');
$('#bDir').addEventListener('click', openDir);
if (!window.showDirectoryPicker) { $('#bDir').hidden = true; $('#bFiles').classList.add('primary'); }
$('#bFiles').addEventListener('click', () => $('#fIn').click());
$('#fIn').addEventListener('change', ev => { openFiles([...ev.target.files]); ev.target.value = ''; });
$('#bSave').addEventListener('click', saveAll);
$('#bReload').addEventListener('click', async () => { if (A.dir && okToDrop()) { try { await readDir(A.dir); } catch (e) { say('Could not reload: ' + e.message, 'err'); } } });
document.addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key.toLowerCase() === 's') { ev.preventDefault(); if (anyDirty()) saveAll(); else say('Nothing to save.'); } });
document.addEventListener('dragover', ev => ev.preventDefault());
document.addEventListener('drop', ev => { ev.preventDefault(); if (ev.dataTransfer && ev.dataTransfer.files.length) openFiles([...ev.dataTransfer.files]); });
window.addEventListener('beforeunload', ev => { if (anyDirty()) { ev.preventDefault(); ev.returnValue = ''; } });
/* ---- served by serve.py: the game's data folder, loaded by itself ---- */
// A stand-in for a folder handle that reads and writes through the launcher, so readDir, Reload and saving work as
// with a folder picked by hand.
const served = location.protocol === 'http:' && (location.hostname === '127.0.0.1' || location.hostname === 'localhost');
const serverDir = {
 name: 'data',
 async getFileHandle(name, opts) {
  const url = '/data/' + name;
  const probe = await fetch(url, {cache: 'no-store'});
  if (!probe.ok && !(opts && opts.create)) { const e = new Error(name + ' not found'); e.name = 'NotFoundError'; throw e; }
  return {
   async getFile() { const res = await fetch(url, {cache: 'no-store'}); if (!res.ok) throw new Error(name + ': ' + res.status); const t = await res.text(); return {text: async () => t}; },
   async createWritable() {
    let out = '';
    return {async write(t) { out += t; }, async close() {
     const res = await fetch(url, {method: 'PUT', body: out, headers: {'Content-Type': 'application/json'}});
     if (!res.ok) throw new Error('the launcher refused ' + name + ' (' + (await res.text()) + ')');
    }};
   },
  };
 },
};
async function autoLoad() {
 if (!served) {
  say('Not loaded: open this through the launcher, tools/lore_editor/lore_editor.bat (or python tools/lore_editor/serve.py), and the game’s data loads by itself. Or open the data folder by hand.', 'err');
  return;
 }
 try {
  // (only the launcher answers this: anything else serving the page can't save)
  const me = await fetch('/lore-editor', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
  if (!me || !me.launcher) { say('This page isn’t being served by the editor’s launcher, so it can’t save. Close it and start tools/lore_editor/lore_editor.bat.', 'err'); return; }
  const res = await fetch('/data/rumors.json', {cache: 'no-store'});
  if (!res.ok) {
   const where = await fetch('/where').then(r => r.json()).catch(() => ({}));
   say('Could not find the game’s data: ' + (where.data ? where.data + '/rumors.json' : 'data/rumors.json') + ' is missing.', 'err');
   return;
  }
  await readDir(serverDir);
 } catch (e) { say('Could not load the game’s data (' + e.message + '). Is the launcher still running?', 'err'); }
}
if (served) { $('#bDir').hidden = true; $('#bFiles').hidden = true; }
autoLoad();
window.LoreEditor = {A, Core, loadTexts, readDir, saveAll, render, serialize, goto, serverDir};
datalists(); render();
})();
</script>
